# Supabase local config. `project_id` is the LOCAL project name; the deployed
# project is selected by `supabase link --project-ref <ref>`.
project_id = "zerro"

# -----------------------------------------------------------------------------
# LOCAL-ONLY edge runtime policy. The default per-request worker policy
# terminates long-running requests ("wall clock duration warning … early
# termination has been triggered"), which kills /generate locally — it does a
# Whisper round-trip plus a multimodal chat call with ~30 images and can run
# 1–3 minutes. `per_worker` keeps the worker alive for the whole request, like
# the deployed runtime. This section affects `supabase functions serve` ONLY;
# deployed functions use Supabase's hosted limits.
# -----------------------------------------------------------------------------
[edge_runtime]
policy = "per_worker"

# -----------------------------------------------------------------------------
# Edge Function gateway JWT settings.
#
# verify_jwt = false means the Supabase API gateway does NOT require a
# Supabase-issued JWT to reach the function. This is correct for all three
# Phase D1 functions, but for DIFFERENT reasons — read carefully before changing:
#
#   * lemonsqueezy-webhook — LemonSqueezy sends no Supabase JWT. Security is the
#     X-Signature HMAC check, done in code.
#   * session — the credential is the LICENSE KEY, not a Supabase JWT. Security
#     is the per-key/per-IP rate limit + key-hash lookup, done in code.
#   * entitlement — verifies OUR session JWT (HS256, SESSION_JWT_SECRET) IN CODE.
#     If the gateway also tried to verify a JWT it would reject the app's token
#     before our code runs. So the gateway check is OFF and the in-code check is
#     the real gate.
#   * generate (Phase D2) — same as entitlement: verifies OUR session JWT IN
#     CODE before transcribing / calling OpenAI / consuming a credit. Gateway
#     gate OFF so the app's token reaches our code.
#   * trial-start (Phase F) — an UNAUTHENTICATED public endpoint: the user is
#     mid-trial with no credential yet. Security is the per-email/per-IP rate
#     limit + a hashed, TTL'd, attempt-limited code + a disposable-domain block
#     + the one-grant-per-email cap, all done in code.
#
# The CLI equivalent is `--no-verify-jwt` on each `supabase functions deploy`
# (see README-backend.md). Keep these in sync.
# -----------------------------------------------------------------------------

[functions.lemonsqueezy-webhook]
verify_jwt = false

[functions.session]
verify_jwt = false

[functions.entitlement]
verify_jwt = false

[functions.generate]
verify_jwt = false

[functions.trial-start]
verify_jwt = false
