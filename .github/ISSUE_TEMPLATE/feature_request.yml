name: Feature request
description: Suggest an improvement or new capability for Zerro.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first; the solution can follow. Please do
        not include personal information, API keys, or unredacted
        screenshots or recordings.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Zerro makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposed-outcome
    attributes:
      label: Proposed outcome
      description: What would you like to happen instead? Describe the outcome rather than a specific implementation, if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches that could solve the same problem.
    validations:
      required: false
  - type: textarea
    id: privacy-implications
    attributes:
      label: Privacy implications
      description: Would this feature touch recordings, screenshots, prompts, keys, or other sensitive data? If so, how should it protect them?
    validations:
      required: false
