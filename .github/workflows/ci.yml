name: CI

# Pull-request checks for the two long-lived branches we merge into.
# Unit-level only: Swift (desktop app) + Deno (Supabase edge functions) + SQL
# (the supabase/test/*_test.sql money-logic assertions — A-02, sql-tests below).
#
# Why no DB-lint / migration-validation job here:
#   Database migrations are already validated on every PR by the Supabase
#   preview branch's `migrate` step (it applies supabase/migrations against a
#   throwaway branch database and fails the PR on a bad migration). Duplicating
#   that here would only add a slower, less authoritative second signal, so this
#   workflow deliberately omits it. (sql-tests below also applies the migrations
#   to a throwaway LOCAL database, but that is setup for the *_test.sql
#   assertions — the preview branch stays the authoritative migration gate.)
on:
  pull_request:
    branches:
      - staging
      - main

# One run per PR: cancel an in-flight run when new commits are pushed. The macOS
# test job is the expensive one, so dropping superseded runs is the main lever
# for keeping macOS minutes down.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Read-only: these jobs only check out code and run tests. No write scopes.
# pull-requests:read lets dorny/paths-filter read the PR's changed-file list
# from the GitHub API on pull_request events.
permissions:
  contents: read
  pull-requests: read

# Single source of truth for the test scheme and the QUARANTINED suites — the
# subprocess/IPC suites that flake on CI even serially (they spawn real child
# processes / sandbox-exec, or bind a loopback socket server, and gate
# assertions on wall-clock waits, so a loaded runner intermittently fails them
# with the failure moving between tests). The required `swift-tests` job runs
# everything EXCEPT these (-skip-testing); the advisory `swift-subprocess-tests`
# job runs ONLY these (-only-testing) and is deliberately excluded from the
# `ci-passed` gate. Keep both jobs in sync through this one list.
#
# Why these three (classified from the test sources, not guessed):
#   DevAgentRunnerTests   — spawns throwaway /bin/sh agent scripts + sandbox-exec
#                           with sleep/elapsed + stall-ordering timing asserts.
#   DevRecoveryTests      — real git via Task.detached behind a settle() poll
#                           that does NOT fail on timeout, so a slow runner reads
#                           stale state and the next assertion fails.
#   DevNetworkProxyTests  — binds a real loopback NWListener every run and polls
#                           async listener teardown behind 5s semaphores.
# The other subprocess suites (GitCheckpointTests, DevDispatchCoordinatorTests,
# DevModeTeardownSafetyTests) stay in the gate: their git spawns are synchronous
# with no wall-clock deadline, so slowness can't convert into a failed assertion.
env:
  SCHEME: Zerro
  QUARANTINE_SUITES: "DevAgentRunnerTests DevRecoveryTests DevNetworkProxyTests"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap ubuntu job that decides which heavy jobs need to run. We do PER-JOB
  # path filtering here (computed once, fanned out via `needs`) rather than a
  # workflow-level `on: pull_request: paths:` filter. Per-job filtering means a
  # docs-only or web-only PR still gets a green CI status, while the costly
  # macOS test job never spins up unless apps/desktop actually changed — that's
  # the macOS-minutes saving. (For pull_request events dorny/paths-filter reads
  # the changed-file list from the GitHub API, so this job needs no checkout.)
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      edge: ${{ steps.filter.outputs.edge }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      # Pinned to a full commit SHA (supply-chain hardening, matching
      # release-app.yml). Trailing comment is the human-readable tag the SHA
      # maps to; bump both together when upgrading.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
            edge:
              - 'supabase/functions/**'
            db:
              - 'supabase/migrations/**'
              - 'supabase/test/**'
              - 'supabase/config.toml'

  # ---------------------------------------------------------------------------
  # Swift unit tests for the macOS app. Only runs when the desktop app changed.
  swift-tests:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26      # default Xcode 26.4.x — matches release-app.yml's runner
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # Pinned to the same SHA release-app.yml uses (v4.3.1).
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Select the Xcode toolchain the SAME way release-app.yml does: glob for
      # the 26.4.x app and fail loudly if it isn't on the runner. Pinned to
      # 26.4.x to stay aligned with the macOS 26.4 deployment target's toolchain.
      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26.4 not found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      # ---- on-device whisper model (WhisperCppTranscriptionServiceTests) ----
      # That suite runs the REAL whisper engine against a small tiny.en model
      # (~31 MB) that is intentionally NOT committed to the repo. We pre-place it
      # at the EXACT cache path the test reads from
      # (~/Library/Caches/ZerroTests/whisper-models) so the test picks it up via
      # its checksum-verified cache branch and runs for real. This deliberately
      # does NOT rely on env vars reaching the test: an xcodebuild unit-test host
      # does not inherit the job environment. Two guards keep this from going
      # silently blind: the download step fails the job on any fetch/checksum
      # error, and the post-test step below fails the job if the engine test
      # didn't actually run. (The test's skip-when-offline path is local-dev only.)
      - name: Cache whisper test model
        id: whisper-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/ZerroTests/whisper-models
          key: whisper-model-ggml-tiny.en-q5_1-c77c5766

      - name: Pre-download whisper test model (on cache miss)
        if: steps.whisper-model.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          DIR="$HOME/Library/Caches/ZerroTests/whisper-models"
          mkdir -p "$DIR"
          curl -fSL --retry 3 -o "$DIR/ggml-tiny.en-q5_1.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin"
          echo "c77c5766f1cef09b6b7d47f21b546cbddd4157886b3b5d6d4f709e91e66c7c2b  $DIR/ggml-tiny.en-q5_1.bin" \
            | shasum -a 256 -c -

      # Build + run the REQUIRED slice of the ZerroTests bundle: everything
      # except the quarantined subprocess/IPC suites (QUARANTINE_SUITES, defined
      # at the workflow level). Debug config, macOS destination, code signing
      # disabled (CI has no Developer ID identity and the test bundle doesn't
      # need one). Output is tee'd so the next step can confirm tests executed.
      # set -o pipefail keeps xcodebuild's exit status through the tee.
      #
      # Two determinism levers, both required:
      #   -parallel-testing-enabled NO  — single test worker. The parallel runner
      #       let the process-spawning suites race each other.
      #   -skip-testing:<suite>         — drops the suites that flake even
      #       serially (real child processes / sandbox-exec / loopback sockets
      #       behind wall-clock waits) from THIS required gate. They still run,
      #       advisory, in swift-subprocess-tests. This is what keeps ci-passed
      #       deterministic on real code.
      - name: Run ZerroTests (required slice; subprocess suites quarantined out)
        run: |
          set -euo pipefail
          SKIP=()
          for s in $QUARANTINE_SUITES; do SKIP+=( -skip-testing:ZerroTests/"$s" ); done
          echo "Quarantined (skipped here, run advisory in swift-subprocess-tests): $QUARANTINE_SUITES"
          xcodebuild test \
            -project Zerro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            "${SKIP[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      # Guard against the silent "linked & launched but ran zero tests" mode,
      # which xcodebuild still reports as ** TEST SUCCEEDED **. With parallel
      # testing disabled (see above) the serial runner prints `Test Suite
      # 'ZerroTests.xctest' started`; the parallel runner instead prints one
      # `Test case '...' passed/failed on 'My Mac…'` line per case. The pattern
      # matches either so the guard survives a future re-enable of parallelism —
      # require at least one such line so a misconfigured scheme that executes
      # nothing fails the job.
      - name: Confirm ZerroTests executed
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/swift-test.log"
          COUNT="$(grep -acE "Test case '.*' (passed|failed)|Test Suite 'ZerroTests" "$LOG" || true)"
          echo "ZerroTests reported $COUNT executed test case line(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::ZerroTests target did not execute any tests."
            exit 1
          fi

      # The on-device whisper engine test MUST have run for real here. With the
      # tiny.en model pre-placed in the cache above, the test can't reach its
      # offline-skip path, so a skip (or an absent line) means the model
      # pre-download/cache regressed — fail loudly rather than let the engine
      # coverage go silently blind.
      - name: Confirm on-device whisper engine test ran
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/swift-test.log"
          if ! grep -qE "testTranscribeProducesExpectedTranscript[]'].* passed" "$LOG"; then
            echo "::error::On-device whisper engine test did not pass (skipped or absent). Check the tiny.en model pre-download/cache step."
            grep -nE "WhisperCppTranscriptionServiceTests|tiny.en model unavailable" "$LOG" || true
            exit 1
          fi
          echo "On-device whisper engine test ran for real."

      # Defense-in-depth for the quarantine invariant: assert that NONE of the
      # quarantined suites executed in this required slice. If a future edit (or
      # a shell word-splitting regression that collapses the -skip-testing flags)
      # silently lets them back into the gate, fail loudly here rather than
      # silently re-importing the flake.
      - name: Confirm quarantined suites were skipped
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/swift-test.log"
          for s in $QUARANTINE_SUITES; do
            if grep -qE "Test Suite '$s'|Test case '$s\." "$LOG"; then
              echo "::error::Quarantined suite $s ran in the required gate — -skip-testing did not apply."
              exit 1
            fi
          done
          echo "Quarantine verified: none of [$QUARANTINE_SUITES] ran in the required slice."

  # ---------------------------------------------------------------------------
  # ADVISORY (non-required) job for the quarantined subprocess/IPC suites
  # (QUARANTINE_SUITES). They spawn real child processes / bind loopback sockets
  # and gate assertions on wall-clock waits, so they flake intermittently on
  # loaded CI runners even serially. This job is DELIBERATELY EXCLUDED from
  # `ci-passed`'s `needs`, so a flake here never blocks a merge — but the suites
  # still RUN, so a genuine regression stays visible as a red (advisory) check.
  #
  # Mirrors swift-tests' build, but runs ONLY the quarantined suites
  # (-only-testing) and retries each failure up to 3x in a FRESH process
  # (-retry-tests-on-failure / -test-iterations / -test-repetition-relaunch):
  # a transient subprocess/socket race passes on retry; a real break fails all 3.
  swift-subprocess-tests:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26.4 not found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Run quarantined subprocess suites (advisory, retried)
        run: |
          set -euo pipefail
          ONLY=()
          for s in $QUARANTINE_SUITES; do ONLY+=( -only-testing:ZerroTests/"$s" ); done
          echo "Advisory subprocess suites (retried up to 3x, fresh process): $QUARANTINE_SUITES"
          xcodebuild test \
            -project Zerro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            "${ONLY[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/swift-subprocess-test.log"

      # Catch a silent zero-run: a renamed/misspelled entry in QUARANTINE_SUITES
      # would make -only-testing match nothing, which xcodebuild still reports as
      # ** TEST SUCCEEDED **. Require every quarantined suite to have actually
      # started, so the advisory signal can't go silently blind. (Only reached
      # when the test step passed; a real failure already fails the job above.)
      - name: Confirm quarantined suites executed
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/swift-subprocess-test.log"
          for s in $QUARANTINE_SUITES; do
            if ! grep -qE "Test Suite '$s'|Test case '$s\." "$LOG"; then
              echo "::error::Quarantined suite $s did not execute (QUARANTINE_SUITES out of sync with the test class names?)."
              exit 1
            fi
          done
          echo "All quarantined suites executed: $QUARANTINE_SUITES"

  # ---------------------------------------------------------------------------
  # Deno unit tests for the Supabase edge functions. Only runs when a function
  # changed.
  edge-tests:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Pinned to a full commit SHA (supply-chain hardening). deno-version is
      # pinned to the runtime the suite was verified against locally; bump both
      # the SHA and the version deliberately.
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282  # v2.0.4
        with:
          deno-version: "2.8.3"

      # Discover and run every *_test.ts suite under supabase/functions.
      #   --allow-env  : config.ts reads function settings from env (and the
      #                  generate/test_setup.ts harness sets test env).
      #   --allow-read : the prompt-mirror tests read the locked prompt files
      #                  under apps/desktop/Scripts/artifact-eval, so the read
      #                  grant is intentionally NOT path-scoped.
      # (deno test auto-discovers *_test.ts, so no explicit file list is needed.)
      - name: Run edge-function tests
        run: deno test --allow-env --allow-read

  # ---------------------------------------------------------------------------
  # SQL money-logic tests (A-02). The supabase/test/*_test.sql files pin the
  # overspend + yearly-refresh invariants: each runs in ONE transaction that is
  # rolled back at the end and signals failure via RAISE EXCEPTION, so
  # `psql -v ON_ERROR_STOP=1` exits non-zero on any violated invariant. This job
  # applies the FULL migration set to a throwaway local Postgres and runs every
  # test file against it.
  #
  # Why the Supabase CLI's local DB and not a stock `postgres` service
  # container: the migration set enables pg_cron + pg_net (20260611120000,
  # 20260618120100), which the stock image lacks — the Supabase Postgres image
  # ships both, so `supabase db start` replays all migrations cleanly.
  sql-tests:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      # The CLI's local-db defaults: supabase/config.toml sets no [db] port
      # override, so the container listens on 54322 as postgres/postgres.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # Pinned to a full commit SHA (supply-chain hardening, matching the other
      # actions here). The CLI version is pinned too; bump both deliberately.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3.0.0
        with:
          version: "2.106.0"

      # Brings up the local database container (Supabase Postgres image — has
      # pg_cron/pg_net) and applies every migration under supabase/migrations.
      # A migration that can't replay from scratch fails HERE, before any test.
      - name: Start local database (applies all migrations)
        run: supabase db start

      # Guard against a silently empty schema (e.g. a CLI behavior change that
      # stops `db start` from applying migrations): a function created by a
      # late migration must exist, or the ROLLED-BACK tests below could pass
      # vacuously against the wrong database.
      - name: Confirm migrations applied
        run: |
          set -euo pipefail
          COUNT="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'refresh_yearly_credit_periods'")"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Migrations did not apply (refresh_yearly_credit_periods missing) — supabase db start no longer replays supabase/migrations?"
            exit 1
          fi
          echo "Migrations applied (refresh_yearly_credit_periods present)."

      # Run every SQL test file. ON_ERROR_STOP makes any RAISE EXCEPTION (or
      # SQL error) exit psql non-zero and fail the job. The glob guard keeps
      # this gate from going silently green if the test files move.
      - name: Run SQL tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(supabase/test/*_test.sql)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No supabase/test/*_test.sql files found — the SQL test gate would be silently empty."
            exit 1
          fi
          for f in "${FILES[@]}"; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

  # ---------------------------------------------------------------------------
  # Routing guard for the public release artifacts. GitHub Releases on this
  # repository are the sole public source for the official dmg and the
  # Sparkle feed; the website (apps/web) serves the two stable URLs installed
  # apps and marketing links depend on — getzerro.app/appcast.xml and
  # getzerro.app/Zerro.dmg — by redirecting each to the matching asset on the
  # latest release. This job pins that contract from the repository alone
  # (no Supabase, no GitHub API; only the npm registry is contacted, to
  # install the website's pinned dependencies) by running the website's
  # routing test against the routes Next.js actually resolves from
  # next.config.ts: both redirects must exist exactly once, point at the
  # expected release asset URL, and be temporary (permanent: false); neither
  # path may be served by a rewrite; no route may target Supabase Storage.
  # An absent, swapped, changed, duplicated, rewritten, or permanent redirect
  # fails the PR. It also rejects a committed apps/web/public/appcast.xml or
  # Zerro.dmg: GitHub Releases are the sole source, so a repository copy is
  # redundant and goes stale on the next release. (Next.js applies redirects
  # before public-file lookup, so a static file would be unreachable anyway —
  # the check exists to keep stale artifacts out of the repository.)
  release-routing-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: No static appcast or dmg may be committed under apps/web/public
        run: |
          set -euo pipefail
          for f in public/appcast.xml public/Zerro.dmg; do
            if [ -e "$f" ]; then
              echo "::error::apps/web/$f exists. GitHub Releases are the sole source for this artifact and the website redirects that path to the latest release asset; a repository copy is redundant and stale. Remove the file."
              exit 1
            fi
          done
          echo "No static appcast.xml or Zerro.dmg under apps/web/public — OK."

      # Pinned to a full commit SHA (supply-chain hardening, matching the
      # other actions here). Node 24: the routing test imports next.config.ts
      # through Node's native TypeScript type stripping (`npm test`).
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install website dependencies
        run: npm ci --no-audit --no-fund

      # Runs ONLY the routing contract test (the rest of the website suite is
      # not a merge gate here). The test resolves next.config.ts's real
      # redirects()/rewrites() and checks both complete entries against
      # hard-coded expected values. The pass count is asserted so a renamed
      # or emptied test file cannot go silently green.
      - name: Website redirects /appcast.xml and /Zerro.dmg to the GitHub Release assets
        run: |
          set -euo pipefail
          TEST=lib/release-routes.test.ts
          test -f "$TEST" || { echo "::error::$TEST is missing — the release routing contract has no test."; exit 1; }
          node --test --test-reporter=spec "$TEST" 2>&1 | tee "$RUNNER_TEMP/routing-test.log"
          PASS="$(grep -E '^ℹ pass [0-9]+' "$RUNNER_TEMP/routing-test.log" | awk '{print $3}' | tail -1)"
          FAIL="$(grep -E '^ℹ fail [0-9]+' "$RUNNER_TEMP/routing-test.log" | awk '{print $3}' | tail -1)"
          if [ -z "$PASS" ] || [ "$PASS" -lt 8 ] || [ "${FAIL:-1}" -ne 0 ]; then
            echo "::error::routing contract test did not run to completion (pass=${PASS:-none}, fail=${FAIL:-unknown})."
            exit 1
          fi
          echo "Routing contract verified from the resolved Next.js config ($PASS checks)."

      - name: Release routing must not reference Supabase Storage
        run: |
          set -euo pipefail
          if grep -nEi 'supabase\.co|storage/v1' lib/release-routes.ts next.config.ts; then
            echo "::error::the website's release routing references Supabase Storage; GitHub Releases are the only public artifact source."
            exit 1
          fi
          echo "No Storage-hosted destination in the site's release routing — OK."

  # ---------------------------------------------------------------------------
  # Aggregate gate. THIS is the single job to mark as the required status check
  # in branch protection — never swift-tests / edge-tests directly. Because
  # those two are path-gated, a PR that doesn't touch apps/desktop (or
  # supabase/functions) leaves the corresponding job `skipped`; a `skipped`
  # required check never resolves and would block the PR forever. This job
  # always runs (`if: always()`) and treats `skipped` as OK, so it goes green on
  # such PRs — while still failing if a job that DID run failed or was cancelled.
  #
  # The advisory swift-subprocess-tests job is intentionally NOT in `needs`: the
  # quarantined subprocess suites must never block the gate, so their flakes (or
  # real failures) stay advisory-only and are surfaced as that job's own check.
  ci-passed:
    needs: [swift-tests, edge-tests, sql-tests, release-routing-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed (skipped is OK)
        run: |
          set -euo pipefail
          swift='${{ needs.swift-tests.result }}'
          edge='${{ needs.edge-tests.result }}'
          sql='${{ needs.sql-tests.result }}'
          routing='${{ needs.release-routing-guard.result }}'
          echo "swift-tests:           $swift"
          echo "edge-tests:            $edge"
          echo "sql-tests:             $sql"
          echo "release-routing-guard: $routing"
          # A path-gated job that didn't run is `skipped` — that's fine.
          # release-routing-guard is not path-gated, so it is `success`/`failure`.
          # Anything that isn't `success`/`skipped` (i.e. failure or cancelled)
          # fails the gate.
          for r in "$swift" "$edge" "$sql" "$routing"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required CI job did not pass (result=$r)."; exit 1 ;;
            esac
          done
          echo "All required CI jobs passed (or were correctly skipped)."
