name: Republish appcast to Storage

# Manual break-glass: upload the committed apps/web/public/appcast.xml to the
# public Supabase Storage object the website now serves the Sparkle feed from
# (downloads/appcast.xml).
#
# Primary use: the ONE-TIME SEED during the git→Storage migration. The normal
# Release (macOS app) workflow uploads the feed to Storage on every release, but
# Storage starts empty, and the website only flips to serving it once
# public/appcast.xml is removed. This job seeds the Storage object from the
# committed feed FIRST, so that removal is a gapless cutover (no 404 window).
#
# It also stays useful afterwards as a force-resync if Storage and the committed
# snapshot ever drift. It uploads the file verbatim — it does NOT re-sign, so the
# committed appcast must already carry valid Sparkle signatures (it does: the
# release workflow generates it).
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Share the release lock so a manual republish can't race a real release's
# appcast upload.
concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same SHA the other workflows use (v4.3.1).
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # SECURITY: this job writes the PRODUCTION update feed with the
      # over-privileged service-role key and re-publishes the appcast VERBATIM
      # (no re-sign), so it must only ever publish REVIEWED content. Hard-fail
      # unless dispatched against the default branch `main` — whose
      # apps/web/public/appcast.xml only changes through a PR (the require-PR
      # ruleset) — so a doctored feed on an unreviewed branch can't be pushed to
      # prod via this dispatch.
      - name: Refuse to run from a non-default ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::republish-appcast must run from main (got ${{ github.ref }}). Refusing to publish unreviewed feed content to production."
          exit 1

      # SECURITY (L-01, mirrors release-app.yml): SUPABASE_SERVICE_ROLE_KEY is a
      # masked GitHub secret, never echoed — no `set -x`, no `curl -v`.
      - name: Upload committed appcast to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail   # NOTE: never add `set -x` here — it would echo the bearer token.
          SRC="apps/web/public/appcast.xml"
          test -f "$SRC" || { echo "::error::$SRC not found (already removed in the storage cutover?)."; exit 1; }
          grep -q "<item>" "$SRC" || { echo "::error::$SRC has no <item> — refusing to publish an empty feed."; exit 1; }
          # cache-control: no-cache — same as release-app.yml; the feed is mutable
          # and must always be revalidated rather than edge-cached.
          curl --fail-with-body -X POST \
            "https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/downloads/appcast.xml" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/xml" \
            -H "Cache-Control: no-cache" \
            -H "x-upsert: true" \
            --data-binary @"$SRC"
          echo "Seeded downloads/appcast.xml from $SRC."
          echo "Public URL: https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/public/downloads/appcast.xml"
