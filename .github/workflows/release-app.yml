name: Release (macOS app)

# Trigger: push a version tag like app-v1.0.7
#   git tag app-v1.0.7 && git push origin app-v1.0.7
on:
  push:
    tags:
      - "app-v*"
  # Allow manually re-running for a given version from the Actions tab.
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.7). Used only for manual runs."
        required: true
      # Explicit, off-by-default opt-in for a TRUE first-time Storage
      # compatibility mirror (no appcast.xml published in the bucket yet). It
      # only allows a MISSING seed — an unreadable, empty, malformed, or
      # non-Storage feed still fails closed. Never needed for an existing
      # mirror; leave it false.
      bootstrap_storage_mirror:
        description: "Bootstrap the Storage compatibility mirror when NO Storage appcast is published yet (first-time only; leave false)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write          # create the GitHub Release and upload its assets (no git push is involved)

# Never run two releases at once: both would race the same GitHub release
# tag and upsert the same Storage compatibility-mirror objects.
concurrency:
  group: release-app
  cancel-in-progress: false

# All build/sign steps run from the app directory inside the monorepo.
defaults:
  run:
    working-directory: apps/desktop

env:
  SCHEME: Zerro
  CONFIGURATION: Release
  APP_NAME: Zerro
  BUNDLE_ID: com.cbreeding.Zerro
  TEAM_ID: H6NWCRRAHV
  # GitHub Releases are the canonical public source for the official artifacts:
  # each release carries Zerro-<build>.dmg, Zerro.dmg, and a signed appcast.xml
  # that advertises this release plus the newest release of every other major
  # version in the release line (so a 1.x install keeps being offered the
  # final 1.x after 2.0 ships), each on its own immutable GitHub asset URL.
  # The line starts at app-v1.0.0 / build 1000; the first release composes
  # from its own feed alone and later releases from their own feed plus the
  # previous release-line feed — never from anything before the line. The
  # Storage mirror is never seeded from GitHub or the website. The website
  # (apps/web/lib/release-routes.ts)
  # redirects getzerro.app/appcast.xml and getzerro.app/Zerro.dmg to those
  # assets on the latest release. The Supabase Storage publication at the end
  # of the job maintains a compatibility mirror for clients that read the
  # Storage objects directly; that mirror keeps its own cumulative feed
  # history and is not what the website routes to. No git push to the
  # (PR-protected) main branch is involved.
  SPARKLE_VERSION: "2.9.2"                        # must match the app's pinned Sparkle
  # First build of the GitHub release line (app-v1.0.0). The line's feeds carry
  # only releases at or above this build; nothing before it is ever read.
  RELEASE_LINE_START_BUILD: "1000"
  RELEASE_LINE_START_VERSION: "1.0.0"             # its tag is app-v1.0.0; build 1000 and version 1.0.0 are inseparable

jobs:
  release:
    runs-on: macos-26      # default Xcode 26.4.x — required for the macOS 26.4 deployment target
    steps:
      # ----------------------------------------------------------------------
      - name: Checkout app repo
        # Pinned to a full commit SHA (supply-chain hardening L-03). The trailing
        # comment is the human-readable tag the SHA corresponds to; bump both
        # together when upgrading.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0          # tags + full history for the tag-target checks and the Slack commit range

      # ----------------------------------------------------------------------
      # Release metadata comes from the checked-in files apps/desktop/VERSION
      # (marketing version, exactly X.Y.Z) and apps/desktop/BUILD_NUMBER (the
      # integer Sparkle compares, bumped by hand and always above the newest
      # published build), read and validated through
      # Scripts/release_metadata.py. Nothing is derived from Git history, and
      # the Xcode project must already carry the same values (drift check).
      # The app-v<X.Y.Z> tag (or the manual-run version input) must name the
      # checked-in VERSION of the released commit, or the run fails here.
      - name: Read release metadata (VERSION + BUILD_NUMBER)
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 Scripts/release_metadata.py read > "$RUNNER_TEMP/metadata.txt"
          MARKETING="$(sed -n 's/^marketing=//p' "$RUNNER_TEMP/metadata.txt")"
          BUILD="$(sed -n 's/^build=//p' "$RUNNER_TEMP/metadata.txt")"
          python3 Scripts/release_metadata.py check-project
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_VERSION" != "$MARKETING" ]; then
              echo "::error::manual run asked for version '$INPUT_VERSION' but apps/desktop/VERSION at this commit is $MARKETING — releases ship the checked-in metadata only."
              exit 1
            fi
          elif [ "$REF_NAME" != "app-v$MARKETING" ]; then
            echo "::error::tag $REF_NAME does not name the checked-in VERSION ($MARKETING) of the tagged commit — the release tag must be app-v$MARKETING."
            exit 1
          fi
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          # Permanent, versioned dmg filename. generate_appcast derives each
          # item's enclosure URL from the archive filename + --download-url-prefix,
          # so naming the dmg Zerro-<build>.dmg yields a per-release immutable URL
          # (…/downloads/Zerro-<build>.dmg) instead of the mutable Zerro.dmg (L-07).
          echo "DMG_NAME=$APP_NAME-$BUILD.dmg" >> "$GITHUB_ENV"
          # The tag this run publishes under. On a tag push it is the ref
          # itself; on a manual run it is derived from the version input, so
          # every GitHub Release step below targets the same app-v<version>
          # instead of the branch name workflow_dispatch runs on.
          echo "RELEASE_TAG=app-v$MARKETING" >> "$GITHUB_ENV"
          echo "Releasing $MARKETING (build $BUILD)"

      # ----------------------------------------------------------------------
      # Fail-closed tag-target check BEFORE the expensive build. A tag-push run
      # must have the tag, and it must resolve (peeling any annotated tag
      # object) to the checked-out commit; a workflow_dispatch run may have no
      # tag yet, in which case the release step below creates it pinned to
      # this commit (target_commitish). A tag that already exists at another
      # commit fails the run here: the release would otherwise advertise
      # assets built from a different commit than its tag names. The script
      # checks the real Git ref, never the release's target_commitish
      # metadata, and treats anything other than a genuine 404 (auth, rate
      # limit, network) as a failure.
      - name: Verify release tag targets this commit (preflight)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: Scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA" preflight "$EVENT_NAME"

      # ----------------------------------------------------------------------
      # Fail-closed release-source check BEFORE the expensive build, in two
      # separate parts (Scripts/verify_release_source.sh):
      #   • The commit being released must be contained in origin/main, the
      #     PRODUCTION RELEASE branch.
      #   • Its .github/workflows must be identical to GitHub's DEFAULT
      #     branch (github.event.repository.default_branch — supplied by the
      #     event, never hardcoded, and not necessarily main). GitHub's
      #     release API compares a release's target commit against the
      #     default branch and rejects the workflow's GITHUB_TOKEN ("Resource
      #     not accessible by integration") when that commit modifies workflow
      #     files relative to it; GITHUB_TOKEN cannot be granted the
      #     workflow-write permission that would allow it. Without this check
      #     the rejection would surface only at publication, after the full
      #     build. The default branch does not need to contain the release
      #     commit.
      # The auto-release tag (created on a main merge) and a manual release of
      # a main commit pass as long as main's workflows match the default
      # branch; a tag or dispatch on any other commit fails here. Fails closed
      # if the default-branch name is missing or either ref cannot be
      # fetched. Both refs are fetched explicitly, then only local history is
      # read.
      - name: Verify release source (main + default-branch workflows)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::error::github.event.repository.default_branch is empty — cannot determine GitHub's default branch for the workflow-tree check. Refusing to guess."
            exit 1
          fi
          git fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          echo "Production release branch: origin/main; GitHub default branch: origin/${DEFAULT_BRANCH}"
          Scripts/verify_release_source.sh "$GITHUB_SHA" origin/main "origin/${DEFAULT_BRANCH}"

      # ----------------------------------------------------------------------
      # Pre-build gate: the released version must have a What's New entry in
      # Changelog.swift. auto-release.yml runs the same check before tagging;
      # this one also covers hand-pushed app-v* tags and workflow_dispatch
      # runs, and it fails BEFORE the expensive sign/notarize pipeline.
      # Intentional internal-only release: [no-changelog] in the released
      # commit's message (for a promotion PR, the PR title lands in the merge
      # commit body), or re-run via auto-release with the marker.
      - name: Require a What's New entry for this version
        run: |
          set -euo pipefail
          COMMIT_MESSAGE="$(git log -1 --format=%B HEAD)"
          python3 Scripts/check_changelog_entry.py \
            --version "${{ steps.ver.outputs.marketing }}" \
            --commit-message "$COMMIT_MESSAGE"

      # ----------------------------------------------------------------------
      # Select the Xcode toolchain. Pinned to 26.4.x to keep the build toolchain
      # aligned with the macOS 26.4 deployment target, not to dodge a compiler
      # bug.
      #
      # NOTE: the SubmenuFlyout.swift EarlyPerfInliner optimizer crash is NOT a
      # 26.5-only regression — it reproduces on 26.4.1 (Swift 6.3.1) too. It is
      # worked around in source (@_optimize(none) on Coordinator.deinit), so
      # this pin does not protect against it.
      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          # Pin to Xcode 26.4.x to match the macOS 26.4 deployment target's
          # toolchain. (The SubmenuFlyout.swift optimizer crash is handled in
          # source, not here — it affects 26.4.1 / Swift 6.3.1 as well.)
          XCODE="$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26.4 not found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      # ----------------------------------------------------------------------
      # Import the Developer ID certificate into a temporary keychain.
      # The keychain (and thus the key) is destroyed when the job finishes.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ----------------------------------------------------------------------
      # Fetch the Sparkle CLI tools (generate_appcast, sign_update) that match
      # the app's pinned Sparkle version.
      - name: Fetch Sparkle tools
        env:
          # SHA-256 of the official Sparkle-2.9.2.tar.xz release asset (supply-chain
          # hardening L-02). Source: the GitHub release-asset digest published by
          # sparkle-project/Sparkle for tag 2.9.2, cross-checked against
          # `shasum -a 256` of the downloaded tarball. generate_appcast below is fed
          # the EdDSA *private* signing key on stdin, so a tampered tarball could
          # exfiltrate it — this digest must be bumped in lockstep with
          # SPARKLE_VERSION (env, top of file).
          SPARKLE_SHA256: "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -fsSL "$URL" -o sparkle.tar.xz
          # Integrity gate: verify the download against the pinned digest and FAIL
          # the job on mismatch, BEFORE extracting or handing the key to it.
          echo "${SPARKLE_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" --version || true

      # ----------------------------------------------------------------------
      # Install the PostHog CLI so the app's dSYM-upload build phase (the
      # "Upload dSYMs to PostHog" Run Script on the Zerro target) can run
      # `posthog-cli` during the Archive step below. The macos runner ships
      # Node/npm, so a global install puts `posthog-cli` on PATH.
      - name: Install PostHog CLI
        # Pinned to an exact version (supply-chain hardening L-02) so a tampered or
        # malicious newer publish can't slip into the signed-build runner. Bump
        # deliberately. (0.7.30 is what the unpinned `latest` resolved to at pin time.)
        run: npm install -g @posthog/cli@0.7.30

      # ----------------------------------------------------------------------
      # Versions are passed directly to xcodebuild below (command-line build
      # settings always override the pbxproj). agvtool is NOT used: without
      # VERSIONING_SYSTEM=apple-generic it silently no-ops on the marketing
      # version, which shipped v1.0.4 binaries that identified as 1.0.1.
      # The EXPLICIT resolved conditions for the official production build:
      # the Release configuration defines no baseline conditions, so the full
      # official set is exactly OFFICIAL_BUILD. Deliberately NOT
      # '$(inherited) OFFICIAL_BUILD' - command-line inheritance is not relied
      # on; if a baseline condition is ever added to the Release config it
      # must be added here in lockstep (the staging workflow lists STAGING
      # explicitly for the same reason). The official build needs BOTH the
      # Swift condition (SWIFT_ACTIVE_COMPILATION_CONDITIONS=OFFICIAL_BUILD,
      # which flips Build.isOfficialBuild) and the C macro
      # (GCC_PREPROCESSOR_DEFINITIONS='$(inherited) OFFICIAL_BUILD=1', which
      # compiles the exported marker in OfficialBuildMarker.c); the two are
      # paired at link time, so a build with only one of them fails instead of
      # producing a half-official artifact. The C macro MUST keep $(inherited):
      # a command-line build setting applies to every target in the build,
      # including the Swift package dependencies, and a bare value would wipe
      # their own preprocessor macros (PLCrashReporter stops compiling). The
      # app's Release configuration defines no baseline macros of its own, so
      # the app resolves to exactly OFFICIAL_BUILD=1. The artifact gate below
      # fails the pipeline if the flags did not take effect.
      - name: Archive
        # These env vars are read by the "Upload dSYMs to PostHog" Run Script
        # build phase on the Zerro target. xcodebuild passes them through to
        # the script, which authenticates `posthog-cli` and targets the Zerro
        # project. Only the API key is secret; project id + host are not.
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "469499"
          POSTHOG_CLI_HOST: "https://us.posthog.com"
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            archive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=OFFICIAL_BUILD \
            'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) OFFICIAL_BUILD=1' \
            ZERRO_BUILD_CHANNEL=official

      - name: Export Developer ID app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "Scripts/ExportOptions.plist"
          test -d "$RUNNER_TEMP/export/$APP_NAME.app"

      # Deterministic official-build gate: the exported ARTIFACT itself must
      # carry both official markers (the Info.plist channel key set by
      # ZERRO_BUILD_CHANNEL=official, and the symbol compiled in only under
      # OFFICIAL_BUILD). If either is missing the pipeline stops here — before
      # the dmg, notarization, or publication — instead of shipping a
      # community build as official.
      - name: Verify official build marker
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print ZerroBuildChannel' "$APP/Contents/Info.plist")"
          [ "$CHANNEL" = "official" ] \
            || { echo "::error::ZerroBuildChannel is '$CHANNEL', expected 'official' — OFFICIAL_BUILD settings were not applied"; exit 1; }
          # The marker is an exported C symbol (`_zerroOfficialBuildMarker`,
          # see BuildEnvironment.swift), the only kind that survives the
          # exported app's STRIP_STYLE=all post-processing. List the DEFINED
          # GLOBAL symbol names and require the exact name as a whole line —
          # never a substring. Capture nm's output first: `nm | grep -q`
          # would let grep exit early, nm take SIGPIPE, and the pipeline fail
          # with 141 under `set -euo pipefail` on a PERFECTLY GOOD artifact.
          GLOBAL_SYMBOLS="$(nm -g --defined-only "$APP/Contents/MacOS/$APP_NAME" | awk '{print $NF}')"
          grep -qx "_zerroOfficialBuildMarker" <<< "$GLOBAL_SYMBOLS" \
            || { echo "::error::the exported app has no _zerroOfficialBuildMarker global symbol — either the OFFICIAL_BUILD condition was not applied to this archive, or the marker did not survive export stripping; refusing to ship it as official"; exit 1; }
          echo "Official build markers verified (plist channel + exported _zerroOfficialBuildMarker symbol)."

      # Fail fast if the built app's versions don't match the tag — this is
      # what generate_appcast reads, so a mismatch here ships a bad appcast.
      - name: Verify app version matches tag
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/export/$APP_NAME.app/Contents/Info.plist"
          GOT_MARKETING="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")"
          GOT_BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")"
          echo "App reports: $GOT_MARKETING (build $GOT_BUILD); expected ${{ steps.ver.outputs.marketing }} (build ${{ steps.ver.outputs.build }})"
          [ "$GOT_MARKETING" = "${{ steps.ver.outputs.marketing }}" ] || { echo "::error::Marketing version mismatch"; exit 1; }
          [ "$GOT_BUILD" = "${{ steps.ver.outputs.build }}" ] || { echo "::error::Build number mismatch"; exit 1; }

      - name: Verify signature + hardened runtime
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "Hardened runtime not enabled — notarization would fail."; exit 1; }

      # ----------------------------------------------------------------------
      - name: Build dmg
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications" || true
          mkdir -p dist
          # The volume name stays "Zerro" (what users see mounted); only the file
          # is versioned so the appcast enclosure resolves to a permanent URL.
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/$DMG_NAME"
          rm -rf "$STAGE"
          codesign --force --sign "Developer ID Application" --timestamp "dist/$DMG_NAME"

      # ----------------------------------------------------------------------
      - name: Notarize + staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY_PATH"

          # Capture the submit output (tee: it still streams to the job log).
          # On failure THIS output holds the real error for THIS run — an auth
          # 403 or the rejection status — and, when a submission was actually
          # created, its id. The old handler asked `notarytool history` for the
          # newest id instead, which on an auth failure (no submission created)
          # fetched a PRIOR release's log and masked the real error (L-08).
          SUBMIT_OUT="$RUNNER_TEMP/notarytool-submit.out"
          if ! xcrun notarytool submit "dist/$DMG_NAME" \
                --key "$KEY_PATH" \
                --key-id "$AC_API_KEY_ID" \
                --issuer "$AC_API_ISSUER_ID" \
                --wait 2>&1 | tee "$SUBMIT_OUT"; then
            echo "::error::notarytool submit failed — its output above is the authoritative error for this run."
            # Only fetch a log for the submission id parsed from THIS submit's
            # own output — never from history (that could be an older release).
            SUB_ID="$(awk '/^[[:space:]]*id: / {print $2; exit}' "$SUBMIT_OUT")"
            if [ -n "${SUB_ID:-}" ]; then
              echo "Fetching the notarization log for this run's submission $SUB_ID…"
              xcrun notarytool log "$SUB_ID" --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" || true
            else
              echo "No submission id in the submit output — the submission was never created (e.g. an auth failure); the submit error above is the whole story."
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"

          xcrun stapler staple "dist/$DMG_NAME"

          # `stapler validate` on a DMG does an ONLINE ticket lookup (a stapled
          # dmg ticket isn't validated purely offline the way a .app's is).
          # Immediately after the notary service returns "Accepted" the ticket
          # can take a short while to become queryable, so a single validate
          # flakes with:
          #   CloudKit query ... failed due to "(null)"
          #   Could not find base64 encoded ticket in response
          #   The validate action failed! Error 65.
          # The staple above already succeeded; retry validation to ride out
          # ticket propagation rather than failing an otherwise-good release.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler validate "dist/$DMG_NAME"; then
              echo "stapler validate succeeded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::stapler validate still failing after $attempt attempts."
              exit 1
            fi
            echo "stapler validate attempt $attempt failed (ticket may still be propagating); retrying in 20s…"
            sleep 20
          done

      # ----------------------------------------------------------------------
      # STORAGE COMPATIBILITY-MIRROR FEED. This is the feed for the Supabase
      # Storage mirror only; it is NOT the GitHub appcast (composed further
      # below as the newest release of each major). The mirror keeps its own
      # cumulative, multi-item history: the new item's download URL points at
      # this release's permanent versioned Storage object, generate_appcast
      # computes its length + edSignature from the actual build, and every
      # prior Storage item is preserved verbatim (its recorded
      # pubDate/length/edSignature/versioned URL). A license covers every
      # release of one major version and the app offers only its installed
      # major (UpdateMajorPolicy), so clients still reading the mirror keep
      # seeing every release of their major.
      #
      # The mirror is seeded ONLY from its own published Storage appcast.
      # The website feed and the GitHub release-line feed carry just the
      # newest release of each major, so seeding from either would silently
      # truncate the mirror: Scripts/storage_mirror_seed.py fails this run
      # closed — before any Storage object is touched — when the published
      # feed is missing, unreadable, empty, malformed, or not a Storage feed.
      # A genuine first-time mirror is the only case that may start without
      # a seed, and only through the explicit bootstrap_storage_mirror
      # workflow_dispatch input (off by default).
      - name: Generate signed appcast (Storage mirror)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BOOTSTRAP_STORAGE_MIRROR: ${{ github.event.inputs.bootstrap_storage_mirror }}
        run: |
          set -euo pipefail
          DL_PREFIX="https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/public/downloads/"
          PUB_STORAGE="${DL_PREFIX}appcast.xml"

          # Download the published mirror feed (cache-busted). A fetch failure
          # leaves no file; the gate below decides — it never falls back.
          rm -f dist/appcast.xml
          if ! curl -fsS "${PUB_STORAGE}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-seed" -o dist/appcast.xml; then
            rm -f dist/appcast.xml
            echo "The published Storage appcast could not be downloaded."
          fi
          SEED_OPTS=()
          if [ "${BOOTSTRAP_STORAGE_MIRROR:-false}" = "true" ]; then
            echo "::warning::bootstrap_storage_mirror=true — a missing Storage appcast will start the mirror from this release alone."
            SEED_OPTS=(--bootstrap)
          fi
          python3 Scripts/storage_mirror_seed.py check \
            --feed dist/appcast.xml \
            --storage-prefix "$DL_PREFIX" \
            ${SEED_OPTS[@]+"${SEED_OPTS[@]}"}

          # generate_appcast MERGES into the seed (appends the new item, keeps
          # every existing one) and preserves items whose archives are absent —
          # it does NOT need the old dmgs present (verified against the pinned
          # Sparkle ${SPARKLE_VERSION} generate_appcast/FeedXML.swift).
          # --maximum-versions 0 = preserve ALL items (Sparkle's documented
          # "keep everything"), so the mirror's full history survives.
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$DL_PREFIX" \
            --maximum-versions 0 \
            --link "https://getzerro.app/" \
            -o "dist/appcast.xml" \
            "dist"

          # Invariants (fail the release rather than ship a bad feed):
          #   • the new build resolves to its versioned, immutable URL, and
          #   • NO item references the mutable marketing Zerro.dmg (which is
          #     overwritten every release and would race its signature — L-07).
          if ! grep -qF "downloads/${DMG_NAME}\"" "dist/appcast.xml"; then
            echo "::error::appcast is missing the versioned enclosure for ${DMG_NAME}"; exit 1
          fi
          if grep -qF "downloads/${APP_NAME}.dmg\"" "dist/appcast.xml"; then
            echo "::error::appcast references the mutable ${APP_NAME}.dmg — only versioned URLs are allowed (run the L-07 build-238 migration first)"; exit 1
          fi
          # Guard: the just-built version must be the NEWEST the feed advertises —
          # its build number must be the max <sparkle:version> in the generated
          # appcast. Catches a tag placed on an old or duplicate commit (e.g.
          # 1.4.18 was tagged on 1.4.17's commit → reused build 242), which would
          # otherwise publish a feed that never offers this build.
          MAX_VER="$(grep -oE '<sparkle:version>[0-9]+</sparkle:version>' dist/appcast.xml | grep -oE '[0-9]+' | sort -n | tail -1 || true)"
          if [ -z "$MAX_VER" ]; then
            echo "::error::generated appcast has no <sparkle:version> element — generate_appcast produced an unexpected format."; exit 1
          fi
          if [ "$MAX_VER" != "${{ steps.ver.outputs.build }}" ]; then
            echo "::error::built build ${{ steps.ver.outputs.build }} is not the newest in the appcast (max sparkle:version=$MAX_VER) — the tag is likely on an old/duplicate commit; bump VERSION on a fresh commit before tagging."
            exit 1
          fi
          # Structural check of the generated feed BEFORE anything is
          # published: this build is present exactly once and is the newest,
          # with this version, the versioned public URL, the dmg's real byte
          # length, and a signature.
          python3 Scripts/appcast_publish_guard.py check \
            --feed dist/appcast.xml \
            --expect-build "${{ steps.ver.outputs.build }}" \
            --expect-version "${{ steps.ver.outputs.marketing }}" \
            --expect-url "${DL_PREFIX}${DMG_NAME}" \
            --expect-length "$(stat -f %z "dist/${DMG_NAME}")"
          echo "----- appcast.xml -----"
          cat dist/appcast.xml

      # ----------------------------------------------------------------------
      # GitHub Release asset set — the canonical public artifacts. Every
      # release carries exactly three assets:
      #   • Zerro-<build>.dmg  — the immutable Sparkle enclosure
      #   • Zerro.dmg          — the stable latest-download copy, byte-identical
      #                          (getzerro.app/Zerro.dmg redirects to it on the
      #                          latest release)
      #   • appcast.xml        — the signed release-line feed: THIS release
      #                          plus the newest release of every other
      #                          major, each on its immutable GitHub URL
      #                          (getzerro.app/appcast.xml redirects to it on
      #                          the latest release)
      #
      # DRAFT-FIRST, FAIL-CLOSED. Because the website resolves
      # releases/latest/download/<asset>, a release must never be published or
      # become "latest" while it carries only the dmgs. The steps below
      # (Scripts/github_release_publish.py) therefore:
      #   1. prepare  — create this run's DRAFT release (or reuse and repair
      #                 the single existing draft for the tag: reset its
      #                 target/title, delete every stale asset). A release
      #                 that is already published for the tag fails closed;
      #                 more than one draft for the tag fails closed.
      #   2. upload   — the two dmgs, then the composed release-line
      #                 appcast; same-name assets are replaced, never doubled.
      #   3. verify   — exactly the three assets, each the local size and
      #                 byte-identical (sha256) after download, on a draft
      #                 pinned to this commit; the downloaded feed then passes
      #                 every feed rule on its own contents. A manifest of the
      #                 verified asset ids/sizes/timestamps is written.
      #   4. publish  — only with that manifest, and only if the draft still
      #                 matches it exactly: draft=false + make_latest=true,
      #                 then confirm the release IS releases/latest.
      # Any failure in 1–3, or in 4 before its PATCH, leaves the release a
      # draft: the previous latest release and both website URLs are
      # unchanged. Storage is untouched until the final mirror block.
      #
      # The two GitHub copies live in separate directories, outside dist/, so
      # generate_appcast (which scans a directory) sees only the immutable
      # archive when it builds the GitHub feed, and the Storage-mirror
      # generator (which scans dist/) never treats either as a second archive.
      - name: Stage GitHub Release assets
        run: |
          set -euo pipefail
          mkdir -p dist/github dist/github-stable
          cp "dist/$DMG_NAME" "dist/github/$DMG_NAME"
          cp "dist/$DMG_NAME" dist/github-stable/Zerro.dmg
          cmp "dist/$DMG_NAME" "dist/github/$DMG_NAME" \
            || { echo "::error::dist/github/$DMG_NAME is not byte-identical to $DMG_NAME"; exit 1; }
          cmp "dist/$DMG_NAME" dist/github-stable/Zerro.dmg \
            || { echo "::error::dist/github-stable/Zerro.dmg is not byte-identical to $DMG_NAME"; exit 1; }
          echo "Staged $DMG_NAME and a byte-identical Zerro.dmg for the GitHub Release."

      # On a tag push the tag already exists and was checked in preflight. On
      # a workflow_dispatch run with no tag yet, the draft records this commit
      # as target_commitish and GitHub creates the tag there at publication;
      # the real tag ref is verified right after publication below.
      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Scripts/github_release_publish.py --repo "$GITHUB_REPOSITORY" prepare \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.marketing }}" \
            --github-env "$GITHUB_ENV"

      - name: Upload dmgs to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Scripts/github_release_publish.py --repo "$GITHUB_REPOSITORY" upload \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --asset "dist/github/$DMG_NAME" \
            --asset dist/github-stable/Zerro.dmg

      # ----------------------------------------------------------------------
      # THE PUBLIC SPARKLE FEED, step 1 — this release's own item. generate_appcast
      # scans dist/github, which holds only the immutable Zerro-<build>.dmg, and
      # writes a single item whose enclosure is
      # https://github.com/<owner>/<repo>/releases/download/<tag>/Zerro-<build>.dmg
      # (built from $GITHUB_REPOSITORY so a repository rename cannot break it)
      # with the length and EdDSA signature computed from the actual bytes.
      # Both validators run on it: exactly one item, this build and version,
      # the immutable tag-specific URL, the dmg's real byte length, a
      # signature, no mutable alias, no /releases/latest/ URL, no Storage host.
      - name: Generate this release's signed GitHub appcast item
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          GH_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          mkdir -p dist/github-feed
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$GH_PREFIX" \
            --link "https://getzerro.app/" \
            -o "dist/github-feed/current.xml" \
            "dist/github"
          python3 Scripts/appcast_publish_guard.py check \
            --feed dist/github-feed/current.xml \
            --expect-build "${{ steps.ver.outputs.build }}" \
            --expect-version "${{ steps.ver.outputs.marketing }}" \
            --expect-url "${GH_PREFIX}${DMG_NAME}" \
            --expect-length "$(stat -f %z "dist/${DMG_NAME}")" \
            --expect-items 1
          python3 Scripts/appcast_github_feed.py verify \
            --flavor production \
            --repo "$GITHUB_REPOSITORY" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-tag "$RELEASE_TAG" \
            --feed dist/github-feed/current.xml \
            --expect-items 1

      # ----------------------------------------------------------------------
      # THE PUBLIC SPARKLE FEED, step 2 — the release-line feed
      # (Scripts/appcast_release_line.py): this release plus the newest release
      # of every OTHER major version already published in the line, so a 1.x
      # install is still offered the final 1.x after 2.0 ships
      # (UpdateMajorPolicy offers only the installed major). Examples:
      # 1.0.0 → [1.0.0]; 1.0.1 → [1.0.1]; 2.0.0 → [final 1.x, 2.0.0];
      # 2.0.1 → [final 1.x, 2.0.1].
      #   • The FIRST release of the line (build == RELEASE_LINE_START_BUILD)
      #     composes from its own item alone. Nothing before the line — no
      #     tag, release, asset, Storage feed, or appcast — is read.
      #   • Every LATER release requires the previous release-line feed: the
      #     appcast.xml asset of the line's current latest release, fetched
      #     through gh. It must be a valid release-line feed (immutable GitHub
      #     URLs of this repository, every build at or above the line start
      #     and below this build, one item per major, tag == app-v<version>)
      #     or the run fails closed — there is no fallback to any other feed,
      #     no repository-wide inventory, and no pin variable.
      #   • Every retained item is checked against its own release
      #     (releases/tags/<tag>, fetched only for the retained tags): it must
      #     be published and carry Zerro-<build>.dmg with a size equal to the
      #     item's recorded length, so every retained signature stays valid.
      # The composed feed is re-parsed and checked before it is uploaded.
      - name: Compose the release-line GitHub appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD="${{ steps.ver.outputs.build }}"
          MARKETING="${{ steps.ver.outputs.marketing }}"
          PREV=()
          if [ "$BUILD" -ne "$RELEASE_LINE_START_BUILD" ]; then
            mkdir -p dist/github-feed/previous
            LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" \
              || { echo "::error::build $BUILD is a later release of the line but no latest release exists — the previous release-line feed is required; refusing to start over."; exit 1; }
            if ! gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir dist/github-feed/previous; then
              echo "::error::latest release $LATEST_TAG carries no appcast.xml — it is not a release of this line, so the previous release-line feed cannot be loaded; refusing to fall back to any other feed."
              exit 1
            fi
            # The helper binds the feed to this tag: its newest item must be
            # exactly $LATEST_TAG, or a stale/replaced feed is rejected.
            PREV=(--previous-feed dist/github-feed/previous/appcast.xml --previous-tag "$LATEST_TAG")
            echo "Previous release-line feed: $LATEST_TAG"
          else
            echo "Build $BUILD starts the release line — composing from this release's item alone."
          fi
          mkdir -p dist/github-feed/releases
          python3 Scripts/appcast_release_line.py plan \
            --repo "$GITHUB_REPOSITORY" \
            --line-start-build "$RELEASE_LINE_START_BUILD" \
            --line-start-version "$RELEASE_LINE_START_VERSION" \
            --current-build "$BUILD" \
            --current-version "$MARKETING" \
            --current-tag "$RELEASE_TAG" \
            --current-feed dist/github-feed/current.xml \
            ${PREV[@]+"${PREV[@]}"} > dist/github-feed/plan.txt
          cat dist/github-feed/plan.txt
          while IFS= read -r tag; do
            case "$tag" in app-v*) ;; *) continue ;; esac
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "dist/github-feed/releases/${tag}.json" \
              || { echo "::error::retained release ${tag} could not be fetched — its asset cannot be verified."; exit 1; }
          done < dist/github-feed/plan.txt
          python3 Scripts/appcast_release_line.py compose \
            --repo "$GITHUB_REPOSITORY" \
            --line-start-build "$RELEASE_LINE_START_BUILD" \
            --line-start-version "$RELEASE_LINE_START_VERSION" \
            --current-build "$BUILD" \
            --current-version "$MARKETING" \
            --current-tag "$RELEASE_TAG" \
            --current-feed dist/github-feed/current.xml \
            ${PREV[@]+"${PREV[@]}"} \
            --release-assets dist/github-feed/releases \
            --output dist/github/appcast.xml
          # The composed feed must still satisfy every per-item rule.
          python3 Scripts/appcast_github_feed.py verify \
            --flavor production \
            --repo "$GITHUB_REPOSITORY" \
            --current-build "$BUILD" \
            --current-tag "$RELEASE_TAG" \
            --feed dist/github/appcast.xml
          python3 Scripts/appcast_publish_guard.py check \
            --feed dist/github/appcast.xml \
            --expect-build "$BUILD" \
            --expect-version "$MARKETING" \
            --expect-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${DMG_NAME}" \
            --expect-length "$(stat -f %z "dist/${DMG_NAME}")"
          echo "----- dist/github/appcast.xml -----"
          cat dist/github/appcast.xml

      - name: Upload appcast to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Scripts/github_release_publish.py --repo "$GITHUB_REPOSITORY" upload \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --asset dist/github/appcast.xml

      # Authenticated verification of the DRAFT (drafts are invisible to
      # anonymous URLs, so everything is fetched through gh): exactly the
      # three assets, each the local size and byte-identical to the notarized
      # build / generated feed after download, on a draft pinned to this
      # commit. The downloaded feed is then re-checked on its own contents:
      # it obeys the release-line rules (one item per major, every build in
      # the line, this build newest), this build's item carries this version,
      # this release's own immutable asset URL, the dmg's real byte length and
      # a signature. Because the dmg bytes match what generate_appcast signed,
      # the recorded edSignature is valid for what the release will serve.
      # Nothing secret is read or printed here.
      - name: Verify draft release assets + feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/gh-verify"
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          python3 Scripts/github_release_publish.py --repo "$GITHUB_REPOSITORY" verify \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --asset "$DMG_NAME=dist/github/$DMG_NAME" \
            --asset "Zerro.dmg=dist/github-stable/Zerro.dmg" \
            --asset "appcast.xml=dist/github/appcast.xml" \
            --download-dir "$VERIFY/assets" \
            --manifest "$VERIFY/manifest.json"
          python3 Scripts/appcast_publish_guard.py check \
            --feed "$VERIFY/assets/appcast.xml" \
            --expect-build "${{ steps.ver.outputs.build }}" \
            --expect-version "${{ steps.ver.outputs.marketing }}" \
            --expect-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${DMG_NAME}" \
            --expect-length "$(stat -f %z "dist/${DMG_NAME}")"
          python3 Scripts/appcast_github_feed.py verify \
            --flavor production \
            --repo "$GITHUB_REPOSITORY" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-tag "$RELEASE_TAG" \
            --feed "$VERIFY/assets/appcast.xml"
          python3 Scripts/appcast_release_line.py check \
            --repo "$GITHUB_REPOSITORY" \
            --line-start-build "$RELEASE_LINE_START_BUILD" \
            --line-start-version "$RELEASE_LINE_START_VERSION" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-version "${{ steps.ver.outputs.marketing }}" \
            --feed "$VERIFY/assets/appcast.xml"
          echo "Draft release $RELEASE_ID ($RELEASE_TAG) verified: $DMG_NAME and Zerro.dmg are byte-identical to the notarized build; appcast.xml is the release-line feed on immutable URLs."

      # Immediately before publication, every retained prior-major release is
      # fetched AGAIN and re-verified from that fresh data: published
      # (draft == false, prerelease == false), exactly one Zerro-<build>.dmg in
      # state "uploaded", size equal to the feed's recorded length. A release
      # that changed since the feed was composed fails the run here, with the
      # draft still unpublished.
      - name: Re-verify retained release assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/gh-verify"
          rm -rf "$VERIFY/retained" && mkdir -p "$VERIFY/retained"
          python3 Scripts/appcast_release_line.py list-retained \
            --repo "$GITHUB_REPOSITORY" \
            --line-start-build "$RELEASE_LINE_START_BUILD" \
            --line-start-version "$RELEASE_LINE_START_VERSION" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-version "${{ steps.ver.outputs.marketing }}" \
            --feed "$VERIFY/assets/appcast.xml" > "$VERIFY/retained.txt"
          while IFS= read -r tag; do
            case "$tag" in app-v*) ;; *) continue ;; esac
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "$VERIFY/retained/${tag}.json" \
              || { echo "::error::retained release ${tag} could not be re-fetched before publication."; exit 1; }
          done < "$VERIFY/retained.txt"
          python3 Scripts/appcast_release_line.py verify-retained \
            --repo "$GITHUB_REPOSITORY" \
            --line-start-build "$RELEASE_LINE_START_BUILD" \
            --line-start-version "$RELEASE_LINE_START_VERSION" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-version "${{ steps.ver.outputs.marketing }}" \
            --feed "$VERIFY/assets/appcast.xml" \
            --release-assets "$VERIFY/retained"

      # THE PUBLICATION. Refuses to run unless the draft still matches the
      # verification manifest exactly (same asset ids, sizes, timestamps, no
      # extras); then flips draft=false + make_latest=true in one PATCH and
      # confirms the release is releases/latest. From this moment
      # getzerro.app/appcast.xml and getzerro.app/Zerro.dmg resolve this
      # release's assets. A failure before the PATCH leaves the draft (and
      # the previous latest) untouched; a failure after it fails the job
      # while the release stays published.
      - name: Publish the verified draft as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Scripts/github_release_publish.py --repo "$GITHUB_REPOSITORY" publish \
            --release-id "$RELEASE_ID" \
            --tag "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --manifest "$RUNNER_TEMP/gh-verify/manifest.json"

      # Re-resolve the REAL tag ref after publication: it must now exist and
      # name the checked-out commit (publication creates a missing tag at the
      # draft's target_commitish; a pre-existing tag was checked in
      # preflight). The release metadata is printed for information only.
      - name: Verify release tag targets this commit (post-publish)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          Scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA" postrelease "$EVENT_NAME"
          echo "Release metadata target_commitish (informational): $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"

      # ----------------------------------------------------------------------
      # STORAGE COMPATIBILITY MIRROR — the only steps that touch the
      # production Storage bucket, and the last thing the job does before the
      # notification. The GitHub Release above is the canonical public source
      # and is already published and latest by now; these steps mirror the
      # same artifacts to the Storage objects (downloads/Zerro-<build>.dmg,
      # downloads/Zerro.dmg, downloads/appcast.xml) so any client or link
      # that reads Storage directly sees the same build as GitHub. A failure
      # anywhere before this block leaves the Storage objects untouched. A
      # failure INSIDE this block fails the workflow but does not invalidate
      # the GitHub Release: it is complete, verified, and what the website
      # resolves — only the mirror objects need repair (re-run the failed
      # uploads by hand; a same-tag re-run of this workflow fails closed at
      # "Prepare draft GitHub Release" because the release is already
      # published).
      #
      # Immediately before the first mutation a monotonic guard reads the LIVE
      # feed (cache-busted): a newer build may publish; an equal build only
      # when its version matches and the release tag resolves to this commit
      # (a same-tag re-run); an older build, or a missing/unreadable/malformed
      # live feed, fails closed. This is what keeps the mutable Zerro.dmg from
      # ever being overwritten by an older build.
      - name: Publication guard (live feed must not move backwards)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live"
          if ! curl -fsS "https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/public/downloads/appcast.xml?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-guard" -o "$RUNNER_TEMP/live/appcast.xml"; then
            echo "::error::could not read the live appcast — refusing to publish over an unknown live state"
            exit 1
          fi
          Scripts/verify_release_tag.sh "$RELEASE_TAG" "$GITHUB_SHA" postrelease "$EVENT_NAME"
          python3 Scripts/appcast_publish_guard.py guard \
            --live "$RUNNER_TEMP/live/appcast.xml" \
            --current-build "${{ steps.ver.outputs.build }}" \
            --current-version "${{ steps.ver.outputs.marketing }}" \
            --tag-matches-commit

      # Two dmg destinations, same bytes (L-07):
      #   • downloads/Zerro-<build>.dmg — PERMANENT, immutable. The only object
      #     the appcast references, so every past release's advertised
      #     edSignature stays valid forever and old builds remain downloadable.
      #     Build numbers are monotonic, so a future release never targets it.
      #   • downloads/Zerro.dmg — the stable "download latest" object,
      #     overwritten every release and never referenced by the appcast. The
      #     guard above guarantees it only ever moves forward.
      # Then the mirror's cumulative feed, with Cache-Control: no-cache so it is always
      # revalidated (Vercel would otherwise edge-cache a stale feed for up to
      # an hour). --fail-with-body makes any HTTP error FAIL the release.
      #
      # SECURITY — L-01 (over-privileged upload credential; remediation pending):
      #   SUPABASE_SERVICE_ROLE_KEY is full backend access (bypasses all RLS)
      #   and is over-privileged for upserting three objects in the downloads
      #   bucket, but the bucket has ZERO RLS write policies, so service_role is
      #   currently the only path that can write — a least-privilege swap
      #   REQUIRES a Supabase-side change (a path-scoped signed upload URL minted
      #   by an edge function; CI would then hold no Supabase key). Until then the
      #   key is a registered GitHub secret (auto-masked in logs) and is never
      #   echoed — no `set -x`, no `curl -v`. ROTATE it as part of that change.
      - name: Publish dmgs + appcast to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail   # NOTE: never add `set -x` here — it would echo the bearer token.
          BASE="https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/downloads"
          curl --fail-with-body -X POST \
            "$BASE/${DMG_NAME}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/x-apple-diskimage" \
            -H "x-upsert: true" \
            --data-binary @"dist/${DMG_NAME}"
          curl --fail-with-body -X POST \
            "$BASE/${APP_NAME}.dmg" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/x-apple-diskimage" \
            -H "x-upsert: true" \
            --data-binary @"dist/${DMG_NAME}"
          curl --fail-with-body -X POST \
            "$BASE/appcast.xml" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/xml" \
            -H "Cache-Control: no-cache" \
            -H "x-upsert: true" \
            --data-binary @"dist/appcast.xml"

      # Read the live objects straight back (cache-busted, with a short retry
      # for propagation) and require them to be byte-identical to what was
      # just built: both dmgs to the local notarized dmg, the feed to the
      # generated cumulative feed — and the live feed must advertise this
      # build as the newest, with this version, length, and signature.
      - name: Verify live Supabase Storage
        run: |
          set -euo pipefail
          PUB="https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/public/downloads"
          OUT="$RUNNER_TEMP/live-verify"
          rm -rf "$OUT" && mkdir -p "$OUT"
          for attempt in 1 2 3 4 5 6; do
            curl -fsS "$PUB/${DMG_NAME}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" -o "$OUT/${DMG_NAME}"
            curl -fsS "$PUB/${APP_NAME}.dmg?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" -o "$OUT/${APP_NAME}.dmg"
            curl -fsS "$PUB/appcast.xml?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" -o "$OUT/appcast.xml"
            if cmp -s "$OUT/${DMG_NAME}" "dist/${DMG_NAME}" && cmp -s "$OUT/${APP_NAME}.dmg" "dist/${DMG_NAME}" && cmp -s "$OUT/appcast.xml" dist/appcast.xml; then
              echo "live objects match the built artifacts on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              cmp "$OUT/${DMG_NAME}" "dist/${DMG_NAME}" || echo "::error::live ${DMG_NAME} is not byte-identical to the notarized dmg"
              cmp "$OUT/${APP_NAME}.dmg" "dist/${DMG_NAME}" || echo "::error::live ${APP_NAME}.dmg is not byte-identical to the notarized dmg"
              cmp "$OUT/appcast.xml" dist/appcast.xml || echo "::error::live appcast.xml is not byte-identical to the generated feed"
              exit 1
            fi
            echo "attempt $attempt: live objects not settled yet; retrying in 10s…"
            sleep 10
          done
          python3 Scripts/appcast_publish_guard.py check \
            --feed "$OUT/appcast.xml" \
            --expect-build "${{ steps.ver.outputs.build }}" \
            --expect-version "${{ steps.ver.outputs.marketing }}" \
            --expect-url "$PUB/${DMG_NAME}" \
            --expect-length "$(stat -f %z "dist/${DMG_NAME}")"
          echo "Live Supabase Storage verified: ${DMG_NAME}, ${APP_NAME}.dmg, and appcast.xml are byte-identical to the built artifacts."

      - name: Done
        run: echo "Released ${{ steps.ver.outputs.marketing }} (build ${{ steps.ver.outputs.build }}). GitHub Release ${{ env.RELEASE_TAG }} carries ${{ env.APP_NAME }}-${{ steps.ver.outputs.build }}.dmg, Zerro.dmg, and appcast.xml — getzerro.app/appcast.xml and getzerro.app/Zerro.dmg redirect to the latest release's assets. The Supabase Storage compatibility mirror was updated to match."

      # ----------------------------------------------------------------------
      # Post the release to Slack: the user-facing What's New highlights (the
      # SAME notes the in-app window shows, parsed from Changelog.swift at
      # release time) PLUS every app commit in the release range, so internal
      # members see everything that shipped. The post ALWAYS fires — a release
      # with no Changelog.swift entry gets a visible ⚠️ flag line instead of a
      # silent skip (internal-only releases are expected; forgotten entries
      # get noticed). Best-effort: the release is already live by this point,
      # so a Slack hiccup only warns, never fails the job. Skips cleanly only
      # when the SLACK_RELEASE_WEBHOOK_URL secret is unset (safe on forks /
      # before the webhook exists).
      #
      # working-directory is overridden to the repo root, and the changelog is
      # read by COMMIT SHA (git show), not from the working tree — that pins
      # the notes to the exact released commit regardless of what earlier
      # steps did to the checkout, for tag pushes and workflow_dispatch alike.
      - name: Notify Slack of release
        if: success()
        working-directory: .
        env:
          SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
          VER: ${{ steps.ver.outputs.marketing }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail   # never add `set -x` — it would echo the webhook URL
          if [ -z "${SLACK_RELEASE_WEBHOOK_URL:-}" ]; then
            echo "SLACK_RELEASE_WEBHOOK_URL not set — skipping Slack notification."
            exit 0
          fi
          git fetch --tags --quiet origin || true
          # Previous app release = nearest app-v* tag before this commit. `^` skips
          # the tag on THIS commit so we don't diff against ourselves. Empty on the
          # first-ever release.
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'app-v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_SHA}"
          else
            RANGE="$GITHUB_SHA"
            COMPARE_URL=""
          fi
          # Every app commit in this release (internal + user-facing), one subject per line.
          git log --no-merges --format='%s' $RANGE -- apps/desktop/ > commits.txt || true
          # User-facing highlights (from the released commit's Changelog.swift, by SHA —
          # the runner is on a detached tag) + the full commit list → Block Kit payload.
          git show "$GITHUB_SHA:apps/desktop/Zerro/WhatsNew/Changelog.swift" 2>/dev/null \
            | python3 apps/desktop/Scripts/changelog_to_slack.py \
                --version "$VER" --build "$BUILD" \
                --commits-file commits.txt --compare-url "$COMPARE_URL" > payload.json || true
          if [ ! -s payload.json ]; then
            echo "::warning::Could not build Slack payload for $VER — skipping."
            exit 0
          fi
          code="$(curl -s -o /tmp/slack_resp -w '%{http_code}' -X POST \
            -H 'Content-type: application/json' \
            --data @payload.json "$SLACK_RELEASE_WEBHOOK_URL" || echo 000)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::warning::Slack notification failed (HTTP $code) — release already published."
          else
            echo "Posted release notes for $VER to Slack."
          fi
