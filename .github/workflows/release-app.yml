name: Release (macOS app)

# Trigger: push a version tag like app-v1.0.7
#   git tag app-v1.0.7 && git push origin app-v1.0.7
on:
  push:
    tags:
      - "app-v*"
  # Allow manually re-running for a given version from the Actions tab.
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.7). Used only for manual runs."
        required: true

permissions:
  contents: write          # create the GitHub Release + push the appcast commit

# Never run two releases at once: both would push an appcast commit to main.
concurrency:
  group: release-app
  cancel-in-progress: false

# All build/sign steps run from the app directory inside the monorepo.
defaults:
  run:
    working-directory: apps/desktop

env:
  SCHEME: Zerro
  CONFIGURATION: Release
  APP_NAME: Zerro
  BUNDLE_ID: com.cbreeding.Zerro
  TEAM_ID: H6NWCRRAHV
  # The website lives in this same repo; Vercel deploys apps/web on push to main.
  SITE_APPCAST_PATH: apps/web/public/appcast.xml     # where the Sparkle appcast is served from
  # Where the dmg download lives (a GitHub Release asset URL is filled in at runtime).
  SPARKLE_VERSION: "2.9.2"                        # must match the app's pinned Sparkle

jobs:
  release:
    runs-on: macos-26      # default Xcode 26.4.x — required for the macOS 26.4 deployment target
    steps:
      # ----------------------------------------------------------------------
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags + full history for build-number derivation

      # ----------------------------------------------------------------------
      # Derive versions. Marketing version comes from the tag (v1.0.2 -> 1.0.2).
      # Build number = total commit count, which is monotonically increasing and
      # therefore always greater than the last release (Sparkle requires this).
      - name: Derive version + build number
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKETING="${{ github.event.inputs.version }}"
          else
            MARKETING="${GITHUB_REF_NAME#app-v}"
          fi
          BUILD="$(git rev-list --count HEAD)"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $MARKETING (build $BUILD)"

      # ----------------------------------------------------------------------
      # Select the Xcode toolchain. Pinned to 26.4.x to keep the build toolchain
      # aligned with the macOS 26.4 deployment target, not to dodge a compiler
      # bug.
      #
      # NOTE: the SubmenuFlyout.swift EarlyPerfInliner optimizer crash is NOT a
      # 26.5-only regression — it reproduces on 26.4.1 (Swift 6.3.1) too. It is
      # worked around in source (@_optimize(none) on Coordinator.deinit), so
      # this pin does not protect against it.
      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          # Pin to Xcode 26.4.x to match the macOS 26.4 deployment target's
          # toolchain. (The SubmenuFlyout.swift optimizer crash is handled in
          # source, not here — it affects 26.4.1 / Swift 6.3.1 as well.)
          XCODE="$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26.4 not found on runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version
          swift --version

      # ----------------------------------------------------------------------
      # Import the Developer ID certificate into a temporary keychain.
      # The keychain (and thus the key) is destroyed when the job finishes.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ----------------------------------------------------------------------
      # Fetch the Sparkle CLI tools (generate_appcast, sign_update) that match
      # the app's pinned Sparkle version.
      - name: Fetch Sparkle tools
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          curl -fsSL "$URL" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/sparkle/bin/generate_appcast" --version || true

      # ----------------------------------------------------------------------
      # Versions are passed directly to xcodebuild below (command-line build
      # settings always override the pbxproj). agvtool is NOT used: without
      # VERSIONING_SYSTEM=apple-generic it silently no-ops on the marketing
      # version, which shipped v1.0.4 binaries that identified as 1.0.1.
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}"

      - name: Export Developer ID app
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "Scripts/ExportOptions.plist"
          test -d "$RUNNER_TEMP/export/$APP_NAME.app"

      # Fail fast if the built app's versions don't match the tag — this is
      # what generate_appcast reads, so a mismatch here ships a bad appcast.
      - name: Verify app version matches tag
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/export/$APP_NAME.app/Contents/Info.plist"
          GOT_MARKETING="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")"
          GOT_BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")"
          echo "App reports: $GOT_MARKETING (build $GOT_BUILD); expected ${{ steps.ver.outputs.marketing }} (build ${{ steps.ver.outputs.build }})"
          [ "$GOT_MARKETING" = "${{ steps.ver.outputs.marketing }}" ] || { echo "::error::Marketing version mismatch"; exit 1; }
          [ "$GOT_BUILD" = "${{ steps.ver.outputs.build }}" ] || { echo "::error::Build number mismatch"; exit 1; }

      - name: Verify signature + hardened runtime
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "Hardened runtime not enabled — notarization would fail."; exit 1; }

      # ----------------------------------------------------------------------
      - name: Build dmg
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications" || true
          mkdir -p dist
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/$APP_NAME.dmg"
          rm -rf "$STAGE"
          codesign --force --sign "Developer ID Application" --timestamp "dist/$APP_NAME.dmg"

      # ----------------------------------------------------------------------
      - name: Notarize + staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8" > "$KEY_PATH"

          if ! xcrun notarytool submit "dist/$APP_NAME.dmg" \
                --key "$KEY_PATH" \
                --key-id "$AC_API_KEY_ID" \
                --issuer "$AC_API_ISSUER_ID" \
                --wait; then
            echo "Notarization failed — fetching log…"
            SUB_ID="$(xcrun notarytool history --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" 2>/dev/null | awk '/id:/ {print $2; exit}')"
            [ -n "${SUB_ID:-}" ] && xcrun notarytool log "$SUB_ID" --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" || true
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"

          xcrun stapler staple "dist/$APP_NAME.dmg"
          xcrun stapler validate "dist/$APP_NAME.dmg"

      # ----------------------------------------------------------------------
      # Upload the notarized + stapled dmg to the public Supabase Storage
      # bucket. The repo is private, so GitHub Release assets 404 for anyone
      # not signed in; the public download is served from Supabase instead.
      # x-upsert overwrites Zerro.dmg so the public URL stays stable across
      # releases. Must run AFTER stapling so the stapled dmg is what ships.
      - name: Upload notarized dmg to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            "https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/downloads/${APP_NAME}.dmg" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/x-apple-diskimage" \
            -H "x-upsert: true" \
            --data-binary @"dist/${APP_NAME}.dmg"

      # ----------------------------------------------------------------------
      # Generate the signed appcast. The download URL points at the public
      # Supabase Storage asset uploaded above. generate_appcast computes the
      # length + edSignature from the actual build, so the appcast can never
      # drift from the shipped dmg.
      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DL_PREFIX="https://wjxqmurgwyxwkezncxke.supabase.co/storage/v1/object/public/downloads/"
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$DL_PREFIX" \
            --link "https://getzerro.app/" \
            -o "dist/appcast.xml" \
            "dist"
          echo "----- appcast.xml -----"
          cat dist/appcast.xml

      # ----------------------------------------------------------------------
      - name: Create GitHub Release + upload dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ver.outputs.marketing }}
          fail_on_unmatched_files: true
          files: |
            apps/desktop/dist/${{ env.APP_NAME }}.dmg

      # ----------------------------------------------------------------------
      # Publish the appcast to the website (same repo). The push to main
      # touches apps/web/, so Vercel auto-deploys it. checkout@v4 leaves the
      # workflow's GITHUB_TOKEN configured for pushes; permissions.contents:
      # write covers it.
      - name: Publish appcast to website (apps/web)
        working-directory: .
        run: |
          set -euo pipefail
          # The runner checked out the release tag (detached HEAD); the appcast
          # commit must land on main.
          git fetch origin main
          git switch main
          cp "apps/desktop/dist/appcast.xml" "$SITE_APPCAST_PATH"
          git config user.name "Zerro Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add "$SITE_APPCAST_PATH"
          if git diff --cached --quiet; then
            echo "Appcast unchanged — nothing to commit."
          else
            git commit -m "chore(web): update appcast for ${{ steps.ver.outputs.marketing }} (build ${{ steps.ver.outputs.build }})"
            # Rebase-retry in case main moved during the ~15 min build.
            for i in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main
            done
          fi

      - name: Done
        run: echo "Released ${{ steps.ver.outputs.marketing }} (build ${{ steps.ver.outputs.build }}). The appcast commit on main triggers a Vercel deploy of apps/web shortly."
